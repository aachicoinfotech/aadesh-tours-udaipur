<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Aadesh Tours Udaipur - Fleet Management & Accounting Vault">
  
  <title>Aadesh Tours Udaipur | Fleet & Accounting Vault</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z'/></svg>">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased select-none">

  <!-- ========================================== -->
  <!-- 1. GOD-MODE MASTER SECURITY PIN OVERLAY    -->
  <!-- ========================================== -->
  <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 bg-opacity-95 backdrop-blur-md">
    <div class="w-full max-w-sm p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl text-center">
      <div class="w-16 h-16 mx-auto mb-4 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h2 class="text-xl font-bold tracking-wide text-white">AADESH TOURS UDAIPUR</h2>
      <p class="text-xs text-slate-400 mt-1 mb-6">Owner-Only Vault Access</p>
      
      <div class="flex justify-center gap-3 mb-6">
        <input type="password" id="pin-display" maxlength="4" readonly 
               class="w-48 text-center text-3xl tracking-widest bg-slate-800 border border-slate-700 rounded-xl py-3 text-amber-400 font-mono outline-none shadow-inner"
               placeholder="••••">
      </div>

      <!-- Numeric Keypad -->
      <div class="grid grid-cols-3 gap-3 mb-4">
        <button class="key-btn" data-val="1">1</button>
        <button class="key-btn" data-val="2">2</button>
        <button class="key-btn" data-val="3">3</button>
        <button class="key-btn" data-val="4">4</button>
        <button class="key-btn" data-val="5">5</button>
        <button class="key-btn" data-val="6">6</button>
        <button class="key-btn" data-val="7">7</button>
        <button class="key-btn" data-val="8">8</button>
        <button class="key-btn" data-val="9">9</button>
        <button class="key-btn text-rose-400 font-semibold text-sm" id="btn-pin-clear">CLEAR</button>
        <button class="key-btn" data-val="0">0</button>
        <button class="key-btn text-emerald-400 font-semibold text-sm" id="btn-pin-unlock">ENTER</button>
      </div>
      
      <p id="auth-error-msg" class="text-xs text-rose-400 min-h-[1rem] font-medium"></p>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. MAIN APPLICATION APP CONTAINER          -->
  <!-- ========================================== -->
  <div id="app-root" class="min-h-screen flex flex-col hidden">
    
    <!-- Top Global App Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-amber-500/20">
          A
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight leading-none">AADESH TOURS</h1>
          <span class="text-[11px] text-amber-400/90 font-medium">Udaipur Fleet Vault</span>
        </div>
      </div>

      <!-- Quick Metrics & Lock -->
      <div class="flex items-center gap-3">
        <div id="header-galla-badge" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-xs">
          <span class="text-slate-400">Galla:</span>
          <span id="header-galla-amount" class="text-emerald-400 font-bold font-mono">₹0</span>
        </div>
        
        <button id="btn-compliance-alert" class="relative p-2 text-slate-400 hover:text-white bg-slate-800/80 rounded-lg border border-slate-700/80 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span id="compliance-badge" class="absolute -top-1 -right-1 hidden w-4 h-4 bg-rose-500 text-white rounded-full text-[10px] font-bold items-center justify-center">0</span>
        </button>

        <button id="btn-lock-app" title="Lock App" class="p-2 text-slate-400 hover:text-rose-400 bg-slate-800/80 rounded-lg border border-slate-700/80 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Tab Screens Content Area -->
    <main class="flex-1 overflow-y-auto pb-24 px-4 py-4 max-w-7xl mx-auto w-full">
      
      <!-- TAB 1: DASHBOARD & GALLA -->
      <section id="tab-dashboard" class="tab-pane space-y-5"></section>

      <!-- TAB 2: TRIPS & DUTY SLIPS -->
      <section id="tab-trips" class="tab-pane hidden space-y-5"></section>

      <!-- TAB 3: INVOICES & BILLING -->
      <section id="tab-billing" class="tab-pane hidden space-y-5"></section>

      <!-- TAB 4: FLEET & DRIVERS -->
      <section id="tab-fleet" class="tab-pane hidden space-y-5"></section>

      <!-- TAB 5: EXPENSES & DAYBOOK -->
      <section id="tab-daybook" class="tab-pane hidden space-y-5"></section>

      <!-- TAB 6: REPORTS & EXPORTS -->
      <section id="tab-reports" class="tab-pane hidden space-y-5"></section>
    </main>

    <!-- Bottom Persistent Navigation Bar (Mobile-First) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 px-2 py-1.5 flex justify-around items-center max-w-7xl mx-auto">
      <button class="nav-tab-btn active" data-target="tab-dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>गल्ला/होम</span>
      </button>

      <button class="nav-tab-btn" data-target="tab-trips">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
        <span>ट्रिप्स</span>
      </button>

      <button class="nav-tab-btn" data-target="tab-billing">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>बिलिंग</span>
      </button>

      <button class="nav-tab-btn" data-target="tab-fleet">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span>गाड़ियां</span>
      </button>

      <button class="nav-tab-btn" data-target="tab-daybook">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>डे-बुक</span>
      </button>

      <button class="nav-tab-btn" data-target="tab-reports">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>रिपोर्ट्स</span>
      </button>
    </nav>
  </div>

  <!-- Global Modal Host for Action Forms (Trip, Expense, Settlements) -->
  <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
    <div id="modal-content" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl p-5">
      <!-- Dynamic Form Injection -->
    </div>
  </div>

  <!-- Main ES6 Orchestrator Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
