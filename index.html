<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aadesh Tours Udaipur - Fleet & Accounting Vault</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
            amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    .vault-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 1rem; padding: 1rem; }
    .stat-metric { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 0.875rem; padding: 0.75rem; }
    .stat-label { font-size: 0.7rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .stat-value { font-family: ui-monospace, monospace; font-size: 1.15rem; font-weight: 800; margin-top: 0.25rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 0.625rem; font-weight: 700; transition: all 0.15s ease-in-out; cursor: pointer; }
    .btn-primary { background: #f59e0b; color: #090d16; }
    .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .btn-success { background: #10b981; color: #ffffff; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.25rem; }
    .form-input, .form-select { width: 100%; background: #090d16; border: 1px solid #334155; color: #ffffff; border-radius: 0.5rem; padding: 0.5rem 0.75rem; outline: none; }
    .badge-status { display: inline-flex; align-items: center; padding: 0.2rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 800; }
    .tally-table { width: 100%; text-align: left; border-collapse: collapse; font-size: 0.75rem; }
    .tally-table th { padding: 0.5rem; color: #64748b; border-bottom: 1px solid #1e293b; font-weight: 700; }
    .tally-table td { padding: 0.6rem 0.5rem; border-bottom: 1px solid rgba(30, 41, 59, 0.6); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <!-- PIN LOCK SCREEN -->
  <div id="pin-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-xs space-y-6 text-center">
      <div class="space-y-1">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-3xl">🚕</div>
        <h1 class="text-xl font-black text-white tracking-wider pt-2">AADESH TOURS</h1>
        <p class="text-xs text-amber-400 font-semibold tracking-widest uppercase">Fleet & Accounting Vault</p>
      </div>
      <div class="flex justify-center gap-3 py-2">
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-700 bg-transparent"></div>
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-700 bg-transparent"></div>
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-700 bg-transparent"></div>
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-700 bg-transparent"></div>
      </div>
      <p id="pin-error-msg" class="text-xs text-rose-400 font-semibold h-4"></p>
      <div class="grid grid-cols-3 gap-2.5">
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="1">1</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="2">2</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="3">3</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="4">4</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="5">5</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="6">6</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="7">7</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="8">8</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="9">9</button>
        <button id="pin-clear" class="btn btn-secondary py-3 text-xs font-bold text-slate-400">CLR</button>
        <button class="pin-key btn btn-secondary py-3 text-lg font-bold font-mono" data-val="0">0</button>
        <button id="pin-backspace" class="btn btn-secondary py-3 text-xs font-bold text-slate-400">⌫</button>
      </div>
      <p class="text-[11px] text-slate-500">Default Master PIN: 2727</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden">
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-base">🚕</div>
        <div>
          <h1 class="text-sm font-black text-white tracking-wide">AADESH TOURS</h1>
          <span class="text-[10px] text-amber-400 font-mono block">UDAIPUR FLEET OS</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800 text-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[10px] text-slate-400">Galla:</span>
          <span id="header-galla-amount" class="font-mono font-bold text-amber-400">₹0</span>
        </div>
        <button id="btn-lock-app" class="btn btn-secondary px-2.5 py-1 text-xs">🔒</button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-3 sm:p-4 space-y-4">
      <div id="main-content" class="space-y-4"></div>
    </main>

    <!-- Expanded Bottom Nav (7 Tabs) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-1 py-1.5 flex items-center justify-around">
      <button id="nav-dashboard" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-amber-400" onclick="App.navigateTo('dashboard')">
        <span class="text-sm">📊</span><span class="text-[9px] font-bold mt-0.5">Dashboard</span>
      </button>
      <button id="nav-fleet" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('fleet')">
        <span class="text-sm">🚘</span><span class="text-[9px] font-bold mt-0.5">Fleet</span>
      </button>
      <button id="nav-trips" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('trips')">
        <span class="text-sm">📋</span><span class="text-[9px] font-bold mt-0.5">Trips</span>
      </button>
      <button id="nav-dutyslip" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('dutyslip')">
        <span class="text-sm">📝</span><span class="text-[9px] font-bold mt-0.5">Duty Slip</span>
      </button>
      <button id="nav-billing" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('billing')">
        <span class="text-sm">💳</span><span class="text-[9px] font-bold mt-0.5">Billing</span>
      </button>
      <button id="nav-daybook" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('daybook')">
        <span class="text-sm">📖</span><span class="text-[9px] font-bold mt-0.5">Daybook</span>
      </button>
      <button id="nav-reports" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('reports')">
        <span class="text-sm">📈</span><span class="text-[9px] font-bold mt-0.5">Reports</span>
      </button>
      <button id="nav-settings" class="nav-item flex flex-col items-center justify-center py-1 px-1 text-slate-400" onclick="App.navigateTo('settings')">
        <span class="text-sm">⚙️</span><span class="text-[9px] font-bold mt-0.5">Settings</span>
      </button>
    </nav>
  </div>

  <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3">
    <div id="modal-content" class="vault-card w-full max-w-lg max-h-[90vh] overflow-y-auto bg-slate-900 border border-slate-700 shadow-2xl"></div>
  </div>

  <!-- Dynamic PIN Lock & App Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let enteredPin = '';

      function getMasterPin() {
        return localStorage.getItem('aadesh_master_pin') || '2727';
      }

      document.querySelectorAll('.pin-key').forEach(btn => {
        btn.addEventListener('click', () => {
          if (enteredPin.length < 4) {
            enteredPin += btn.getAttribute('data-val');
            updatePinDots();
          }
          if (enteredPin.length === 4) {
            if (enteredPin === getMasterPin()) {
              document.getElementById('pin-screen').classList.add('hidden');
              document.getElementById('main-app').classList.remove('hidden');
              if (window.App) window.App.init();
            } else {
              document.getElementById('pin-error-msg').innerText = 'Galat PIN! (Default: 2727)';
              enteredPin = '';
              updatePinDots();
            }
          }
        });
      });

      document.getElementById('pin-clear').addEventListener('click', () => {
        enteredPin = '';
        updatePinDots();
        document.getElementById('pin-error-msg').innerText = '';
      });

      document.getElementById('pin-backspace').addEventListener('click', () => {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      });

      document.getElementById('btn-lock-app').addEventListener('click', () => {
        enteredPin = '';
        updatePinDots();
        document.getElementById('pin-error-msg').innerText = '';
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('pin-screen').classList.remove('hidden');
      });

      function updatePinDots() {
        const dots = document.querySelectorAll('.pin-dot');
        dots.forEach((dot, idx) => {
          if (idx < enteredPin.length) {
            dot.classList.add('bg-amber-400', 'border-amber-400');
          } else {
            dot.classList.remove('bg-amber-400', 'border-amber-400');
          }
        });
      }
    });
  </script>

  <!-- Complete Service Scripts -->
  <script src="./js/services/daybook-service.js"></script>
  <script src="./js/services/reports-service.js"></script>
  <script src="./js/services/expense-service.js"></script>
  <script src="./js/services/driver-settlement.js"></script>
  
  <!-- View Scripts -->
  <script src="./js/views/dashboard-view.js"></script>
  <script src="./js/views/fleet-view.js"></script>
  <script src="./js/views/trips-view.js"></script>
  <script src="./js/views/duty-slip-view.js"></script>
  <script src="./js/views/billing-view.js"></script>
  <script src="./js/views/daybook-view.js"></script>
  <script src="./js/views/reports-view.js"></script>
  <script src="./js/views/settings-view.js"></script>
  
  <script src="./js/app.js"></script>
</body>
</html>
